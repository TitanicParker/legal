<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document — Strong Formulation</title>
  <meta name="description" content="Readable Markdown viewer for the Strong Formulation legal repository.">
  <style>
    :root {
      color-scheme: light dark;
      --bg:#f7f7f5; --paper:#fff; --text:#1d1d1f; --muted:#6a6a6a; --line:#deded9; --link:#184c88; --quote:#ecece7; --code:#f1f1ee;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#151515; --paper:#1d1d1d; --text:#eeeeea; --muted:#aaa; --line:#383834; --link:#8ab4e8; --quote:#292927; --code:#262624; }
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.62; }
    header { position:sticky; top:0; z-index:10; border-bottom:1px solid var(--line); background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px); }
    .bar { max-width:1100px; margin:auto; padding:10px 18px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
    .bar a { color:var(--link); text-decoration:none; font-weight:650; }
    .bar .title { flex:1; min-width:220px; color:var(--muted); overflow-wrap:anywhere; }
    main { max-width:960px; margin:30px auto 80px; padding:0 18px; }
    article { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:clamp(22px,4vw,52px); box-shadow:0 1px 2px rgb(0 0 0 / 4%); }
    article h1, article h2, article h3, article h4 { line-height:1.2; margin-top:1.5em; }
    article h1 { margin-top:0; font-size:clamp(2rem,5vw,3rem); }
    article h2 { padding-top:.35em; border-top:1px solid var(--line); }
    article p, article li { max-width:78ch; }
    article a { color:var(--link); }
    article blockquote { margin:1.3em 0; padding:.2em 1em; border-left:4px solid var(--line); background:var(--quote); }
    article code { background:var(--code); padding:.14em .32em; border-radius:4px; font-size:.92em; }
    article pre { overflow:auto; background:var(--code); padding:14px; border-radius:8px; }
    article pre code { padding:0; background:none; }
    table { display:block; max-width:100%; overflow-x:auto; border-collapse:collapse; margin:1.3em 0; }
    th, td { border:1px solid var(--line); padding:8px 10px; vertical-align:top; }
    img { max-width:100%; height:auto; }
    hr { border:0; border-top:1px solid var(--line); margin:2em 0; }
    .message { padding:18px; color:var(--muted); }
    .warning { margin-bottom:18px; padding:12px 14px; border:1px solid var(--line); border-radius:8px; background:var(--quote); }
    @media print { header,.warning { display:none; } body,main { background:white; margin:0; } article { border:0; box-shadow:none; padding:0; } }
  </style>
</head>
<body>
<header>
  <div class="bar">
    <a href="index.html">← Index</a>
    <span id="docTitle" class="title">Loading…</span>
    <a id="sourceLink" href="#">Raw source</a>
  </div>
</header>
<main>
  <div class="warning">HTML is a reading layer only. The repository Markdown/source material remains controlling.</div>
  <article id="content"><div class="message">Loading document…</div></article>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  const REPO='TitanicParker/legal';
  const BRANCH='main';
  const params=new URLSearchParams(location.search);
  const file=params.get('file');
  const content=document.getElementById('content');
  const title=document.getElementById('docTitle');
  const source=document.getElementById('sourceLink');

  function safePath(path){
    if(!path || path.includes('..') || path.startsWith('/') || !/\.md$/i.test(path)) return null;
    return path;
  }

  async function load(){
    const path=safePath(file);
    if(!path){
      title.textContent='Invalid document';
      content.innerHTML='<div class="message">No valid Markdown file was specified.</div>';
      source.style.display='none';
      return;
    }
    title.textContent=path;
    document.title=`${path} — Strong Formulation`;
    source.href=`https://github.com/${REPO}/blob/${BRANCH}/${encodeURI(path)}`;
    try{
      const url=`https://raw.githubusercontent.com/${REPO}/${BRANCH}/${encodeURI(path)}`;
      const res=await fetch(url,{cache:'no-store'});
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const md=await res.text();
      marked.setOptions({gfm:true,breaks:false});
      content.innerHTML=marked.parse(md);
      for(const a of content.querySelectorAll('a')){
        const href=a.getAttribute('href')||'';
        if(/^https?:/i.test(href)){ a.target='_blank'; a.rel='noopener noreferrer'; }
        else if(/\.md(?:#.*)?$/i.test(href)){
          const [p,hash='']=href.split('#');
          a.href=`viewer.html?file=${encodeURIComponent(p)}${hash ? '#'+hash : ''}`;
        }
      }
    }catch(err){
      content.innerHTML=`<div class="message">Could not load <strong>${path.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}</strong>. ${String(err.message||err)}</div>`;
    }
  }
  load();
</script>
</body>
</html>
